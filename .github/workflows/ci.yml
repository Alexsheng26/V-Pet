name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一个分支上只跑最新的一次，旧的直接取消
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    # 这个 job 不是"顺便在 Linux 上也跑一遍"，而是一道**架构守卫**：
    # state.py / screens.py / ledges.py / config.py 声称不依赖 Qt，也不依赖 Windows。
    # 这里刻意**不安装 PySide6**、在 Linux 上跑它们的测试 ——
    # 哪天有人往行为层里 import 了一个 QPoint，这个 job 会立刻红，
    # 而在 Windows 上跑全套是发现不了的。
    name: 架构守卫 · 行为层不依赖 Qt (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 确认环境里真的没有 PySide6
        run: |
          if python -c "import PySide6" 2>/dev/null; then
            echo "::error::环境里装了 PySide6，这个 job 就失去意义了"
            exit 1
          fi
          echo "没有 PySide6 ✓"
      - name: 跑不依赖 Qt 的那些测试
        # 新增 Qt-free 模块时**必须**把对应的测试加进来，
        # 否则这个 job 照样是绿的，但它根本没在检查新模块。
        run: >
          python -m unittest -v
          tests.test_brain tests.test_screens tests.test_config tests.test_ledges

  test:
    name: 测试 · Windows · Python ${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 是 README 承诺的下限，3.14 是开发用的版本。
        # PySide6 6.11 的约束是 >=3.10,<3.15。
        python: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: 全部测试
        # offscreen 平台不需要桌面会话。测试里也各自 setdefault 了，
        # 这里再显式设一遍，免得将来新增的测试忘了设就在 CI 上挂掉。
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -v
      - name: 源码模式自检（渲一遍所有状态）
        env:
          QT_QPA_PLATFORM: offscreen
        run: python main.py --selftest

  build:
    name: 打包
    needs: [portable, test]
    runs-on: windows-latest
    # runner 上没有可交互的桌面会话，Qt 找不到 windows 平台插件会直接 abort ——
    # 生成图标和跑打包后的自检都要建 QGuiApplication，所以整个 job 走 offscreen。
    # 这不会削弱验证：Qt 的 Core/Gui/Widgets 照样要从包体里加载起来，
    # 而 windows 平台插件有没有被打进去，由 build.py 里的显式文件断言来管。
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Qt 环境探针
        # 打包链路里每个脚本都要建 QGuiApplication。这一步单独把平台插件的情况
        # 打出来，万一以后又挂在这儿，日志里能直接看出是环境问题还是代码问题，
        # 而不是只留下一个 "build.py 非零退出"。
        run: >
          python -c "import sys; from PySide6.QtGui import QGuiApplication;
          app = QGuiApplication(sys.argv);
          print('platform =', app.platformName(), '| screens =', len(app.screens()))"
      - name: 打包并自检
        # --no-window-check：runner 上真开一个置顶窗口需要可交互桌面会话，
        # 是最容易因环境而非代码挂掉的一步；它验的东西 --selftest 都覆盖了。
        #
        # 失败时把日志尾部写进 ::error:: 注解。Actions 的**日志**端点要鉴权，
        # 而**注解**对公开仓库是可读的 —— 于是排查时不必非得开浏览器翻日志。
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "build.log"
          python tools/build.py --no-window-check *> $log
          $code = $LASTEXITCODE
          Get-Content $log
          if ($code -ne 0) {
            $tail = ((Get-Content $log -Tail 30) -join ' // ')
            if ($tail.Length -gt 3000) { $tail = $tail.Substring($tail.Length - 3000) }
            Write-Host "::error title=build.py exit $code::$tail"
            exit 1
          }
      - name: 文档生成器还能跑吗
        # make_demo 自带断言：所有状态都要在动图里出现、落地冲击要真的越过摔懵阈值，
        # 否则退出码非零。等于顺手把物理参数的回归也挡住了。
        run: python tools/make_demo.py "${{ runner.temp }}/demo.gif"
      - name: 压成 zip
        run: Compress-Archive -Path dist/v-pet/* -DestinationPath v-pet-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: v-pet-windows-x64
          path: v-pet-windows-x64.zip
          retention-days: 30

  release:
    name: 发布
    # 只有推 v* 标签才发版，日常 push 到此为止
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v-pet-windows-x64
      - name: 写发布说明
        run: |
          cat > notes.md <<'EOF'
          ## 安装

          解压后双击 `v-pet.exe`，目标机器**不需要装 Python**。约 65 MB，冷启动 1 秒出头。

          ## 能玩什么

          - 左键拖着甩出去 —— 落地会弹，摔得够狠会摔懵
          - 拖到屏幕左右边缘松手 —— **趴在墙上**，双手撑着墙慢慢往下滑
          - 扔到窗口上方 —— 站在标题栏上溜达，窗口挪动它跟着走
          - 拖到桌面图标上松手 —— 歪头打量
          - 双击它，或在它身上来回搓 —— 摸头
          - 放着不管半分钟 —— 睡着
          - 右键 / 托盘 —— 跟着鼠标、改大小、开机自启

          **怎么退出**：右键菜单、托盘图标，或者点中它按 `Esc`。
          无边框窗口没有关闭按钮，这条值得先看一眼。

          ## 换皮

          把 PNG 按 `sprites/{idle,walk,drag,fall,sleep,happy,cling,dizzy,curious}/00.png`
          丢进 exe 旁边的 `sprites/` 目录，程序会自动使用，一行代码都不用改。
          EOF
      - name: 建 Release
        # 用 gh CLI 而不是第三方 action：少一个供应链依赖，runner 上本来就装了 gh。
        # 不跟 --generate-notes 混用 —— 两个 notes 来源同时给的行为没有明确保证。
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" v-pet-windows-x64.zip
          --title "v-pet $GITHUB_REF_NAME"
          --notes-file notes.md
